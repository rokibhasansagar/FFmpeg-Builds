name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: false
        required: false
      buildOnly:
        description: 'Only build ffmpeg'
        type: boolean
        default: false
        required: false
  schedule:
    # Runs at 02:10 UTC on roughly every 5th day of every month
    - cron: '10 2 1,11,21 * *'
    - cron: '10 2 6,16,26 * *'

env:
  DOCKER_BUILDKIT: 1
  REMOVE_DEPS: >-
    avisynth chromaprint davs2 dvd frei0r gme kvazaar libbluray
    librist libssh libzmq lilv openal openapv openmpt pulseaudio
    rav1e sdl snappy uavs3d whisper xavs2 xvid librsvg

concurrency:
  group: ffmpeg-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_matrix:
    name: Generate Matrix
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - id: matrix
        run: |
          COMBINATIONS=(
            {win64,linux64}:nonfree{,-shared}{," 5.1"," 6.1"," 7.1"," 8.1"}
          )
          MATRIX_JSON=$(printf "%s\n" "${COMBINATIONS[@]}" | jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map(split(":") | {
                target: .[0], 
                variant: .[1],
                allow_failure: (.[1] | contains("5.1"))
              })
            | {include: .}
          ')
          echo "build_matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT

  build_base:
    name: Build base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: "BtbN/FFmpeg-Builds"
          fetch-depth: 0
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Apply minimal dependency set
        run: |
          awk -v drop="$REMOVE_DEPS" '
            BEGIN {
              n = split(drop, a, /[[:space:]]+/)
              for (i = 1; i <= n; i++) rm[a[i]] = 1
            }
            /^    echo / {
              dep = $0
              sub(/^    echo /, "", dep)
              if (dep in rm) next
            }
            { print }
          ' scripts.d/zz-final.sh > scripts.d/zz-final.sh.tmp &&
          mv scripts.d/zz-final.sh.tmp scripts.d/zz-final.sh
          echo "=== Final dependency manifest ==="
          sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/zz-final.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Get download cache key
        if: ${{ !cancelled() }}
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        if: ${{ !cancelled() }}
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
          tar czf .cache/cache.tar.gz .cache/downloads/*
      - name: Upload cache artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: download-cache
          overwrite: true
          path: .cache/cache.tar.gz
          compression-level: 1
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_target_bases:
    name: Build target base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: build_base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,linux64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: "BtbN/FFmpeg-Builds"
          fetch-depth: 0
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Apply minimal dependency set
        run: |
          awk -v drop="$REMOVE_DEPS" '
            BEGIN {
              n = split(drop, a, /[[:space:]]+/)
              for (i = 1; i <= n; i++) rm[a[i]] = 1
            }
            /^    echo / {
              dep = $0
              sub(/^    echo /, "", dep)
              if (dep in rm) next
            }
            { print }
          ' scripts.d/zz-final.sh > scripts.d/zz-final.sh.tmp &&
          mv scripts.d/zz-final.sh.tmp scripts.d/zz-final.sh
          echo "=== Final dependency manifest ==="
          sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/zz-final.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base-${{ matrix.target }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_targets:
    name: Build target-variant image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: [generate_matrix,build_target_bases]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: "BtbN/FFmpeg-Builds"
          fetch-depth: 0
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Apply minimal dependency set
        run: |
          awk -v drop="$REMOVE_DEPS" '
            BEGIN {
              n = split(drop, a, /[[:space:]]+/)
              for (i = 1; i <= n; i++) rm[a[i]] = 1
            }
            /^    echo / {
              dep = $0
              sub(/^    echo /, "", dep)
              if (dep in rm) next
            }
            { print }
          ' scripts.d/zz-final.sh > scripts.d/zz-final.sh.tmp &&
          mv scripts.d/zz-final.sh.tmp scripts.d/zz-final.sh
          echo "=== Final dependency manifest ==="
          sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/zz-final.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${{ matrix.target }}-${{ matrix.variant }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_ffmpeg:
    name: Build ffmpeg
    if: ${{ ( github.event.inputs.buildOnly == 'true' && !cancelled() ) || success() }}
    needs: [generate_matrix,build_targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.build_matrix) }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: "BtbN/FFmpeg-Builds"
          fetch-depth: 0
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Apply minimal dependency set
        run: |
          awk -v drop="$REMOVE_DEPS" '
            BEGIN {
              n = split(drop, a, /[[:space:]]+/)
              for (i = 1; i <= n; i++) rm[a[i]] = 1
            }
            /^    echo / {
              dep = $0
              sub(/^    echo /, "", dep)
              if (dep in rm) next
            }
            { print }
          ' scripts.d/zz-final.sh > scripts.d/zz-final.sh.tmp &&
          mv scripts.d/zz-final.sh.tmp scripts.d/zz-final.sh
          echo "=== Final dependency manifest ==="
          sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/zz-final.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}
      - name: Build ffmpeg
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Print FFmpeg manifests
        continue-on-error: true
        if: ${{ matrix.target == 'linux64' && contains(matrix.variant, 'shared') }}
        run: |
          set -e
          shopt -s nullglob
          ARCHIVES=(artifacts/*.tar.xz)
          [ "${#ARCHIVES[@]}" -gt 0 ]
          rm -rf /tmp/ffmpeg-manifest
          mkdir -p /tmp/ffmpeg-manifest
          tar -xf "${ARCHIVES[0]}" -C /tmp/ffmpeg-manifest
          FFMPEG="$(find /tmp/ffmpeg-manifest -type f -path '*/bin/ffmpeg' -print -quit)"
          [ -n "$FFMPEG" ]
          chmod +x "$FFMPEG"
          echo "=== $FFMPEG -buildconf ==="
          "$FFMPEG" -buildconf
          echo "=== $FFMPEG -decoders ==="
          "$FFMPEG" -decoders
          echo "=== $FFMPEG -encoders ==="
          "$FFMPEG" -encoders
          echo "=== $FFMPEG -demuxers ==="
          "$FFMPEG" -demuxers
          echo "=== $FFMPEG -muxers ==="
          "$FFMPEG" -muxers
          echo "=== $FFMPEG -filters ==="
          "$FFMPEG" -filters
          echo "=== $FFMPEG -protocols ==="
          "$FFMPEG" -protocols
          echo "=== $FFMPEG -hwaccels ==="
          "$FFMPEG" -hwaccels
      - name: Replace spaces in string
        id: strs
        run: |
          SLUG="${{ matrix.target }}-${{ matrix.variant }}"
          echo "artifact_slug=${SLUG// /-}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.strs.outputs.artifact_slug }}
          overwrite: true
          path: artifacts/*
          compression-level: 1
  publish_release:
    name: Publish release
    if: ${{ !cancelled() && ( github.event_name == 'schedule' || github.event.inputs.doRelease == 'true' ) && needs.build_ffmpeg.result == 'success' }}
    needs: build_ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools p7zip-full
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: "BtbN/FFmpeg-Builds"
          fetch-depth: 0
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Checkout Self
        uses: actions/checkout@v7
        with:
          path: "self"
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts
      - name: Create release
        id: create_release
        run: |
          set -xe
          shopt -s nullglob
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          NAME="Auto-Build $RELDATE"
          TAGNAME="autobuild-$(date +'%Y-%m-%d-%H-%M')"
          (cd artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          ./util/release_body.sh "$TAGNAME" artifacts/*.{zip,tar.xz} > release_body.md
          gh release create "$TAGNAME" --repo rokibhasansagar/FFmpeg-Builds --target "master" --title "$NAME" --notes-file release_body.md artifacts/*.{zip,tar.xz} artifacts/checksums.*
          echo "tag_name=${TAGNAME}" >> $GITHUB_OUTPUT
          echo "rel_date=${RELDATE}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Latest
        run: |
          set -xe
          shopt -s nullglob
          mkdir latest_artifacts worktmpdir
          sudo mount -o size=75%,uid="${UID}" -t tmpfs tmpfs ./worktmpdir
          (cd worktmpdir && ../util/repack_latest.sh ../latest_artifacts ../artifacts/*.{zip,tar.xz})
          (cd latest_artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          NAME="Latest Auto-Build (${{ steps.create_release.outputs.rel_date }})"
          TAGNAME="latest"
          ./util/release_body.sh "$TAGNAME" latest_artifacts/*.{zip,tar.xz} > latest_body.md
          gh release delete --cleanup-tag --yes "$TAGNAME" --repo rokibhasansagar/FFmpeg-Builds || true
          sleep 15
          gh release create "$TAGNAME" --repo rokibhasansagar/FFmpeg-Builds --target "master" --title "$NAME" --notes-file latest_body.md latest_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune old releases
        continue-on-error: true
        run: ../util/prunetags.sh
        working-directory: "self"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  clean_logs:
    name: Workflow Cleaner
    needs: publish_release
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '10 2 1,11,21 * *' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: igorjs/gh-actions-clean-workflow@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          runs_older_than: 12

