name: FFmpeg Builds

on:
  workflow_dispatch:
    inputs:
      stageOnly:
        description: Build base, target, and variant images only
        type: boolean
        default: false
        required: false
      buildOnly:
        description: Build FFmpeg only, reusing existing target images
        type: boolean
        default: false
        required: false
      quickRelease:
        description: Build FFmpeg using existing images and publish a release
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "30 1 1,11,21 * *"
    - cron: "30 9 1,11,21 * *"
    - cron: "30 1 2,12,22 * *"

permissions:
  contents: write
  packages: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  generate_matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
      base_target_matrix: ${{ steps.matrix.outputs.base_target_matrix }}
    steps:
      - name: Generate combinations
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          COMBINATIONS=(
            {win64,linux64}:nonfree{,-shared}{," 5.1"," 7.1"," 8.1"}{," litelto"," hwaccel"," litelto hwaccel"}
          )

          # Cron #2 also stages linuxarm64 7.1 variants and their add-ons.
          if [[ "$EVENT_NAME" == "schedule" &&
                "$EVENT_SCHEDULE" == "30 9 1,11,21 * *" ]]; then
            COMBINATIONS+=(
              linuxarm64:nonfree{,-shared}" 7.1"{," litelto"," hwaccel"," litelto hwaccel"}
            )
          fi

          matrix="$(
            printf '%s\n' "${COMBINATIONS[@]}" |
              jq -Rnc '
                [
                  inputs | split(":") |
                  {
                    target: .[0],
                    variant: .[1],
                    allow_failure: (.[1] | test("(^| )(5\\.1|litelto)( |$)"))
                  }
                ] | {include: .}
              '
          )"

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              # Cron #1: stage all standard variants except 5.1.
              "30 1 1,11,21 * *")
                matrix="$(jq -c '
                  .include |= map(select(
                    (.variant | test("(^| )5\\.1( |$)") | not)
                  ))
                ' <<< "$matrix")"
                ;;

              # Cron #2: standard targets get 5.1; linuxarm64 gets 7.1.
              "30 9 1,11,21 * *")
                matrix="$(jq -c '
                  .include |= map(select(
                    (
                      .target == "linuxarm64" and
                      (.variant | test("(^| )7\\.1( |$)"))
                    ) or (
                      .target != "linuxarm64" and
                      (.variant | test("(^| )5\\.1( |$)"))
                    )
                  ))
                ' <<< "$matrix")"
                ;;
            esac
          fi

          # litelto FFmpeg builds reuse the matching non-litelto target image.
          target_matrix="$(jq -c '
            .include
            | map(.variant |= (
                (" " + . + " ")
                | gsub(" litelto "; " ")
                | gsub(" +"; " ")
                | sub("^ "; "")
                | sub(" $"; "")
              ))
            | unique_by([.target, .variant])
            | map(.allow_failure = (.variant | test("(^| )5\\.1( |$)")))
            | {include: .}
          ' <<< "$matrix")"

          base_target_matrix="$(jq -c '
            .include
            | map({target: .target})
            | unique_by(.target)
            | {include: .}
          ' <<< "$target_matrix")"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "target_matrix=$target_matrix" >> "$GITHUB_OUTPUT"
          echo "base_target_matrix=$base_target_matrix" >> "$GITHUB_OUTPUT"

  build_base:
    name: Build shared base image
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.stageOnly == true
        ) || (
          github.event_name == 'schedule' &&
          (
            github.event.schedule == '30 1 1,11,21 * *' ||
            github.event.schedule == '30 9 1,11,21 * *'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          path: upstream

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: self

      - name: Free disk space
        working-directory: upstream
        run: ./util/free_disk_space.sh

      - name: Get download cache key
        id: dl_cache
        working-directory: upstream
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore or create download cache
        uses: actions/cache@v6
        with:
          path: upstream/.cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-

      - name: Download dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          ./download.sh
          ./util/clean_cache.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: upstream/.github/buildkit.toml

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/base"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "rawname=${IMAGE#ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: upstream/images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache

      - name: Cleanup untagged images
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.image.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_target_bases:
    name: Build target base image (${{ matrix.target }})
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.stageOnly == true
        ) || (
          github.event_name == 'schedule' &&
          (
            github.event.schedule == '30 1 1,11,21 * *' ||
            github.event.schedule == '30 9 1,11,21 * *'
          )
        )
      }}
    needs: [generate_matrix, build_base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.base_target_matrix) }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          path: upstream

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: self

      - name: Free disk space
        working-directory: upstream
        run: ./util/free_disk_space.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: upstream/.github/buildkit.toml

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image name
        id: image
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/base-${TARGET}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "rawname=${IMAGE#ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/}" >> "$GITHUB_OUTPUT"
          echo "gh_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push target base image
        uses: docker/build-push-action@v7
        with:
          context: upstream/images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache
          build-args: |
            GH_REPO=${{ steps.image.outputs.gh_repo }}

      - name: Cleanup untagged images
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.image.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_targets:
    name: Build target image (${{ matrix.target }} / ${{ matrix.variant }})
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.stageOnly == true
        ) || (
          github.event_name == 'schedule' &&
          (
            github.event.schedule == '30 1 1,11,21 * *' ||
            github.event.schedule == '30 9 1,11,21 * *'
          )
        )
      }}
    needs: [generate_matrix, build_target_bases]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.target_matrix) }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          path: upstream

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: self

      - name: Free disk space
        working-directory: upstream
        run: ./util/free_disk_space.sh

      - name: Apply add-ons and prune dependencies
        uses: ./self/.github/actions/ffmpeg-workflow-patches
        with:
          apply-dependencies: "true"
          hwaccel: ${{ contains(matrix.variant, 'hwaccel') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: upstream/.github/buildkit.toml

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Get download cache key
        id: dl_cache
        working-directory: upstream
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: upstream/.cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-

      - name: Set image name
        id: image
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          SLUG="${VARIANT// /-}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}-${SLUG}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "rawname=${IMAGE#ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/}" >> "$GITHUB_OUTPUT"

      - name: Generate target image
        working-directory: upstream
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          read -r -a PARTS <<< "$VARIANT"
          BASE_VARIANT="${PARTS[0]}"
          ADDINS=("${PARTS[@]:1}")
          ./generate.sh "$TARGET" "$BASE_VARIANT" "${ADDINS[@]}"

      - name: Build and push target image
        uses: docker/build-push-action@v7
        with:
          context: upstream
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache

      - name: Cleanup untagged images
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_name: ${{ steps.image.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_ffmpeg:
    name: Build FFmpeg (${{ matrix.target }} / ${{ matrix.variant }})
    needs: [generate_matrix, build_targets]
    if: >-
      ${{
        !cancelled() &&
        needs.generate_matrix.result == 'success' &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            (
              (
                inputs.buildOnly == true &&
                inputs.stageOnly != true &&
                inputs.quickRelease != true
              ) || (
                inputs.quickRelease == true &&
                (
                  inputs.stageOnly != true ||
                  needs.build_targets.result == 'success'
                )
              )
            )
          ) || (
            github.event_name == 'schedule' &&
            github.event.schedule == '30 1 2,12,22 * *'
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.matrix) }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          path: upstream

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: self

      - name: Free disk space
        working-directory: upstream
        run: ./util/free_disk_space.sh

      - name: Create FFmpeg add-ons
        uses: ./self/.github/actions/ffmpeg-workflow-patches
        with:
          apply-dependencies: "false"
          hwaccel: ${{ contains(matrix.variant, 'hwaccel') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Get download cache key
        id: dl_cache
        working-directory: upstream
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: upstream/.cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-

      - name: Build FFmpeg
        working-directory: upstream
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          read -r -a PARTS <<< "$VARIANT"
          BASE_VARIANT="${PARTS[0]}"
          ADDINS=("${PARTS[@]:1}")
          ./build.sh "$TARGET" "$BASE_VARIANT" "${ADDINS[@]}"

      - name: Prepare artifact name
        id: artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: echo "name=ffmpeg-${TARGET}-${VARIANT// /-}" >> "$GITHUB_OUTPUT"

      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: upstream/artifacts/*
          if-no-files-found: error
          overwrite: true

  publish_release:
    name: Publish release
    if: >-
      ${{
        !cancelled() &&
        needs.build_ffmpeg.result == 'success' &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.quickRelease == true
          ) || (
            github.event_name == 'schedule' &&
            github.event.schedule == '30 1 2,12,22 * *'
          )
        )
      }}
    needs: build_ffmpeg
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout upstream utilities
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          path: upstream
          fetch-depth: 1

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: self
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Free Disk-Space
        working-directory: upstream
        env:
          MIN_FREE_GB: 90
        run: ./util/free_disk_space.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools p7zip-full

      - name: Download FFmpeg artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts

      - name: Create release
        id: create_release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(artifacts/*.zip artifacts/*.tar.xz)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No FFmpeg archives were downloaded."
            exit 1
          fi

          (
            cd artifacts
            archives=( *.zip *.tar.xz )
            sha256sum "${archives[@]}" > checksums.sha256
          )

          RELDATE="$(date -u +'%Y-%m-%d %H:%M')"
          NAME="Auto-Build $RELDATE UTC"
          TAGNAME="autobuild-$(date -u +'%Y-%m-%d-%H-%M')"

          upstream/util/release_body.sh \
            "$TAGNAME" "${files[@]}" > release_body.md

          gh release create "$TAGNAME" \
            --repo rokibhasansagar/FFmpeg-Builds \
            --target master \
            --title "$NAME" \
            --notes-file release_body.md \
            "${files[@]}" artifacts/checksums.sha256

          echo "tag_name=$TAGNAME" >> "$GITHUB_OUTPUT"
          echo "rel_date=$RELDATE" >> "$GITHUB_OUTPUT"

      - name: Update Latest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p latest_artifacts worktmpdir

          sudo mount \
            -o "size=75%,uid=${UID}" \
            -t tmpfs tmpfs ./worktmpdir

          (
            cd worktmpdir
            ../upstream/util/repack_latest.sh \
              ../latest_artifacts \
              ../artifacts/*.zip \
              ../artifacts/*.tar.xz
          )

          latest_files=(
            latest_artifacts/*.zip
            latest_artifacts/*.tar.xz
          )

          if (( ${#latest_files[@]} == 0 )); then
            echo "::error::Repacking produced no Latest archives."
            exit 1
          fi

          (
            cd latest_artifacts
            archives=( *.zip *.tar.xz )
            sha256sum "${archives[@]}" > checksums.sha256
          )

          upstream/util/release_body.sh \
            latest "${latest_files[@]}" > latest_body.md

          gh release delete latest \
            --repo rokibhasansagar/FFmpeg-Builds \
            --cleanup-tag --yes || true

          sleep 15

          gh release create latest \
            --repo rokibhasansagar/FFmpeg-Builds \
            --target master \
            --title "Latest Auto-Build (${{ steps.create_release.outputs.rel_date }} UTC)" \
            --notes-file latest_body.md \
            "${latest_files[@]}" latest_artifacts/checksums.sha256

      - name: Prune old releases and tags
        continue-on-error: true
        shell: bash
        working-directory: self
        run: ../upstream/util/prunetags.sh

  clean_logs:
    name: Clean workflow logs
    needs: publish_release
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 1 2,12,22 * *' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Clean workflow logs
        uses: igorjs/gh-actions-clean-workflow@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          runs_older_than: 12

