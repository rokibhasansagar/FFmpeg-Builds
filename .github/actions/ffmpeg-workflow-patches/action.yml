name: FFmpeg workflow patches
description: Prune unwanted dependencies and install FFmpeg build add-ons

inputs:
  apply-dependencies:
    description: Remove unwanted dependency build scripts before generating target images
    required: false
    default: "true"
  hwaccel:
    description: Keep hardware-acceleration dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Prune dependency scripts
      if: ${{ inputs.apply-dependencies == 'true' }}
      shell: bash
      working-directory: upstream
      env:
        HWACCEL: ${{ inputs.hwaccel }}
      run: |
        set -euo pipefail

        REMOVE_DEPS=(
          avisynth
          chromaprint
          davs2
          dvd
          frei0r
          gme
          kvazaar
          libbluray
          librist
          libssh
          libzmq
          lilv
          openal
          openapv
          openmpt
          pulseaudio
          rav1e
          rustdedup
          sdl
          snappy
          uavs3d
          whisper
          xavs2
          xvid
          librsvg
        )

        # VAAPI's build depends on the X11 stack, so retain it in hwaccel builds.
        if [[ "$HWACCEL" != "true" ]]; then
          REMOVE_DEPS+=(
            opencl
            vulkan
            libplacebo
            amf
            libglvnd
            ffnvcodec
            onevpl
            vaapi
            x11
            libxcb
            libx11
            libxext
            libxfixes
            libxrender
            libxv
            libxrandr
            libxss
            libxshmfence
            libxau
            libxdmcp
            libxcursor
            libxi
            libxinerama
            xorg-macros
            pixman
          )
        fi

        printf 'Pruning dependency scripts:\n'
        printf '  %s\n' "${REMOVE_DEPS[@]}"

        for dep in "${REMOVE_DEPS[@]}"; do
          while IFS= read -r -d '' path; do
            printf 'Removing %s\n' "$path"
            rm -rf -- "$path"
          done < <(
            find scripts.d \
              -mindepth 1 \
              -maxdepth 3 \
              -iname "*${dep}*" \
              -print0
          )
        done

        # Remove dependency declarations from every remaining script, not only
        # zz-final.sh. For example, 15-base.sh directly declares xorg-macros,
        # so pruning its build script alone would leave a dangling dependency.
        while IFS= read -r -d '' script; do
          tmp="$(mktemp)"
          awk -v deps="${REMOVE_DEPS[*]}" '
            BEGIN {
              count = split(deps, dep, " ")
              for (i = 1; i <= count; i++) drop[dep[i]] = 1
            }
            $1 == "echo" && NF == 2 {
              name = $2
              gsub(/["\047]/, "", name)
              if (name in drop) next
            }
            { print }
          ' "$script" > "$tmp"
          cat "$tmp" > "$script"
          rm -f "$tmp"
        done < <(find scripts.d -type f -name '*.sh' -print0)

        echo "=== Remaining base dependency declarations ==="
        sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/15-base.sh 2>/dev/null || true
        echo "=== Final dependency manifest ==="
        sed -n '/^ffbuild_depends() {/,/^}/p' scripts.d/zz-final.sh

    - name: Create litelto add-on
      shell: bash
      working-directory: upstream
      run: |
        set -euo pipefail
        mkdir -p addins

        cat > addins/litelto.sh <<'ADDIN'
        #!/bin/bash

        # Use the corresponding standard target image instead of a separately
        # staged LTO image. The FFmpeg build uses LTO; dependencies do not.
        IMAGE="${IMAGE/-litelto/}"

        FF_CONFIGURE="$FF_CONFIGURE --enable-lto --extra-cflags=-flto=auto --extra-cxxflags=-flto=auto --extra-ldflags=-flto=auto"
        ADDIN

    - name: Create hwaccel add-on
      shell: bash
      working-directory: upstream
      run: |
        set -euo pipefail
        mkdir -p addins

        cat > addins/hwaccel.sh <<'ADDIN'
        #!/bin/bash

        HWACCEL_CONFIGURE=""
        case "$TARGET" in
            win*)
                HWACCEL_CONFIGURE="--enable-amf --enable-ffnvcodec --enable-opencl --enable-vulkan"
                ;;
            linux*)
                HWACCEL_CONFIGURE="--enable-ffnvcodec --enable-vaapi --enable-opencl --enable-vulkan"
                ;;
        esac

        # oneVPL is available in this workflow for FFmpeg 6.0+ on non-ARM targets.
        if [[ "$TARGET" != *arm64 ]] && (( $(ffbuild_ffver) >= 600 )); then
            HWACCEL_CONFIGURE="$HWACCEL_CONFIGURE --enable-libvpl"
        fi

        FF_CONFIGURE="$FF_CONFIGURE $HWACCEL_CONFIGURE"

        ffbuild_dockeraddin() {
            to_df "ENV FF_CONFIGURE=\"\$FF_CONFIGURE $HWACCEL_CONFIGURE\""
        }
        ADDIN

